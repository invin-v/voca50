<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수능 영단어 50일</title>
<meta name="theme-color" content="#f6ecb0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영단어 50일">
<style>
:root{
  --paper:#fbf4c8; --paper2:#f6ecb0; --ink:#20242c; --sub:#5d6470; --rule:#b7c6d8; --margin:#e07a6e;
  --accent:#1f4fa3; --ok:#2e8b57; --chip:#fffbe0; --cover:#eadf9c; --hy:rgba(255,214,0,.6); --hp:rgba(255,120,170,.45); --hg:rgba(90,210,120,.5);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#1e1d17; --paper2:#28261d; --ink:#ece7d3; --sub:#a9a48f; --rule:#3e4a58; --margin:#a8574e;
    --accent:#8fb4ff; --ok:#3f9d6a; --chip:#2b2920; --cover:#3a372a; --hy:rgba(255,214,0,.38); --hp:rgba(255,110,165,.4); --hg:rgba(80,200,110,.38);}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:10;background:var(--paper2);border-bottom:2px solid var(--margin)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0;white-space:nowrap}
h1 small{font-weight:500;color:var(--sub);font-size:13px;margin-left:6px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tbtn{border:1px solid var(--rule);background:var(--chip);border-radius:8px;padding:5px 10px;font-size:14px;min-height:34px}
.tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw.y{background:#ffd600}.sw.p{background:#ff78aa}.sw.g{background:#5ad278}
label.chk{display:inline-flex;align-items:center;gap:5px;font-size:14px;border:1px solid var(--rule);background:var(--chip);border-radius:8px;padding:5px 10px;min-height:34px;cursor:pointer}
label.chk input{width:16px;height:16px;margin:0}
main{max-width:1100px;margin:0 auto;padding:0 16px 80px}
.dtitle{display:flex;align-items:baseline;gap:10px;padding:18px 0 6px 44px}
.dtitle h2{margin:0;font-size:24px}
.dtitle span{color:var(--sub);font-size:14px}
.hint{color:var(--sub);font-size:13px;padding:0 0 8px 44px}
.card{display:flex;border-bottom:1px solid var(--rule);padding:14px 0}
.num{flex:0 0 44px;color:var(--margin);font-weight:700;font-size:14px;padding-top:5px;border-right:1px solid var(--margin);margin-right:12px}
.body{flex:1;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.word{font-size:24px;font-weight:800;letter-spacing:.2px}
.ipa{color:var(--sub);font-size:15px}
.spk{border:1px solid var(--rule);background:var(--chip);border-radius:50%;width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent)}
.spk.sm{width:26px;height:26px;margin-left:6px;vertical-align:middle}
.spk svg{width:16px;height:16px}
.spk.sm svg{width:13px;height:13px}
.spk:active{transform:scale(.92)}
.kn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:3px 12px 3px 8px;font-size:13px;min-height:30px;margin-left:auto}
.kn::before{content:"";width:16px;height:16px;border:2px solid var(--sub);border-radius:4px;display:inline-block}
.kn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.kn[aria-pressed="true"]::before{content:"✓";border-color:#fff;font-size:12px;line-height:13px;text-align:center}
.card.known .word,.card.known .mean,.card.known .exs{opacity:.5}
body.todo .card.known{display:none}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.prog{height:6px;background:var(--cover);border-radius:3px;margin:0 0 6px 44px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.lv{font-size:11px;border-radius:4px;padding:1px 6px;border:1px solid var(--rule);color:var(--sub)}
.mean{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:17px;cursor:default}
.mean .mi{display:inline-flex;gap:5px;align-items:baseline}
.cn{color:var(--margin);font-weight:700}
.pos{font-style:normal;font-size:12px;color:var(--sub);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
body.test .mean:not(.shown){cursor:pointer}
body.test .mean:not(.shown) .mi{display:none}
body.test .mean:not(.shown)::before{content:"터치해서 뜻 보기";background:var(--cover);color:var(--sub);font-size:13px;border-radius:6px;padding:3px 14px}
.exs{margin-top:8px;display:grid;gap:8px}
.ex{display:flex;gap:8px}
.ex .cn{flex:0 0 auto}
.en{font-size:16.5px}
.ko{margin-top:2px;font-size:15px;color:var(--sub);cursor:pointer;border-radius:6px;min-height:26px}
.ko.hid{background:var(--cover);padding:2px 12px;display:inline-block;font-size:13px}
.ko.hid .hl{display:none}
.ko.hid::before{content:"터치해서 해석 보기"}
mark{color:inherit;border-radius:3px;padding:1px 0}
mark.y{background:var(--hy)}mark.p{background:var(--hp)}mark.g{background:var(--hg)}
body.pen .hl{cursor:text}
body.pen mark{cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:12px;padding:22px 0}
.nav button{border:1px solid var(--rule);background:var(--chip);border-radius:10px;padding:10px 18px;font-size:15px}
.nav button:disabled{opacity:.35;cursor:default}
.menu{border:1px solid var(--rule);background:var(--chip);border-radius:8px;width:40px;height:36px;padding:0;font-size:20px;line-height:1;flex:0 0 auto}
.cur{font-weight:800;color:var(--accent);font-size:16px;margin-right:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,82vw);background:var(--paper);z-index:30;transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:2px 0 14px rgba(0,0,0,.28)}
body.open #drawer{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .22s}
body.open #shade{opacity:1;pointer-events:auto}
.dhead{background:linear-gradient(120deg,#0b8a7a,#45b5a6);color:#fff;padding:calc(30px + env(safe-area-inset-top)) 20px 18px}
.dhead b{display:block;font-size:20px}
.dhead span{opacity:.88;font-size:14px}
.dlist{overflow-y:auto;flex:1;overscroll-behavior:contain}
.day{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:15px 20px;font-size:18px;text-align:left}
.day small{font-size:13px;color:var(--sub)}
.day[aria-current="true"]{background:var(--paper2);font-weight:800;box-shadow:inset 5px 0 0 var(--accent)}
.day.done small{color:var(--ok);font-weight:700}
.inst{border:0;border-top:1px solid var(--rule);background:var(--paper2);padding:14px 20px calc(14px + env(safe-area-inset-bottom));font-size:16px;font-weight:700;text-align:left;color:var(--accent)}
#ibar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;background:#20242c;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.45;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#ibar span{flex:1}
#ibar button{border:0;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:700;flex:0 0 auto}
#ibar .go{background:#ffd600;color:#20242c}
#ibar .x{background:transparent;color:#fff;font-size:18px;padding:4px 8px}
@media (min-width:900px){
  #ibar{left:282px;max-width:560px}
  body{padding-left:270px}
  #drawer{transform:none;width:270px;box-shadow:none;border-right:1px solid var(--rule)}
  #shade,.menu{display:none}
  .day{padding:11px 20px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){#drawer,#shade{transition:none}}
@media (max-width:480px){
  .word{font-size:21px}
  .num{flex-basis:32px;margin-right:10px}
  .dtitle,.hint{padding-left:0}
  .prog{margin-left:0}
}
</style>
</head>
<body>
<div id="shade"></div>
<div id="ibar" hidden><span id="imsg"></span><button class="go" id="igo">설치</button><button class="x" id="ix" aria-label="닫기">×</button></div>
<nav id="drawer" aria-label="Day 선택">
  <div class="dhead"><b>수능 영단어 50일</b><span id="total"></span></div>
  <div class="dlist" id="dlist"></div>
  <button class="inst" id="inst" hidden>📲 홈 화면에 앱으로 추가</button>
</nav>
<header>
  <div class="bar">
    <button class="menu" id="menu" aria-label="Day 목록 열기" aria-expanded="false">☰</button>
    <h1>수능 영단어 50일</h1><span class="cur" id="cur"></span>
    <div class="tools">
      <button class="tbtn" id="pen" aria-pressed="false" title="켜고 글자를 드래그하면 줄이 그어집니다">🖍 형광펜</button>
      <button class="sw y" data-c="y" aria-label="노랑" aria-pressed="true"></button>
      <button class="sw p" data-c="p" aria-label="분홍" aria-pressed="false"></button>
      <button class="sw g" data-c="g" aria-label="초록" aria-pressed="false"></button>
      <label class="chk"><input type="checkbox" id="test">뜻 가리기</label>
      <button class="tbtn" id="allko" aria-pressed="false">해석 모두 보기</button>
      <label class="chk"><input type="checkbox" id="todo">안 외운 것만</label>
    </div>
  </div>
</header>
<div class="wrap">
  <main>
    <div class="dtitle"><h2 id="dh"></h2><span id="dsub"></span></div>
    <div class="prog"><i id="pbar"></i></div>
    <div class="hint" id="hint"></div>
    <div id="list"></div>
    <div class="nav"><button id="prev">← 이전 Day</button><button id="next">다음 Day →</button></div>
  </main>
</div>
<script>

const LVN=['','기본','수능 필수','고난도'];

const LS='voca50.';
const store={
  get(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
};
const $=s=>document.querySelector(s);
let KN=store.get('known',{});
let HL=store.get('hl',{}), day=Math.min(Math.max(1,store.get('day',1)),DAYS.length||1);

function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function hl(text,key,cls){const s=h('span','hl'+(cls?' '+cls:''));s.dataset.k=key;s.dataset.t=text;paint(s);return s}
function paint(el){
  const t=el.dataset.t, rs=(HL[el.dataset.k]||[]).slice().sort((a,b)=>a[0]-b[0]);
  el.textContent='';let p=0;
  rs.forEach((r,i)=>{
    const s=Math.max(p,Math.min(r[0],t.length)), e=Math.min(r[1],t.length);
    if(e<=s)return;
    if(s>p)el.append(t.slice(p,s));
    const m=h('mark',r[2],t.slice(s,e));m.dataset.s=r[0];el.append(m);p=e;
  });
  if(p<t.length)el.append(t.slice(p));
}
function addRange(key,s,e,c){
  let out=[];
  (HL[key]||[]).forEach(r=>{
    if(r[1]<=s||r[0]>=e){out.push(r);return}
    if(r[0]<s)out.push([r[0],s,r[2]]);
    if(r[1]>e)out.push([e,r[1],r[2]]);
  });
  out.push([s,e,c]);out.sort((a,b)=>a[0]-b[0]);
  const mg=[];out.forEach(r=>{const l=mg[mg.length-1];if(l&&l[1]===r[0]&&l[2]===r[2])l[1]=r[1];else mg.push(r)});
  HL[key]=mg;
}
function spkBtn(text,sm){
  const b=h('button','spk'+(sm?' sm':''));b.innerHTML=SPK;b.setAttribute('aria-label','발음 듣기');b.dataset.say=text;return b;
}
function render(){
  const list=DAYS[day-1]||[], root=$('#list');root.textContent='';
  $('#dh').textContent='Day '+day;$('#dsub').textContent=list.length+'단어';
  list.forEach((it,i)=>{
    const [w,ipa,lv,m,ex]=it;
    const card=h('article','card');card.append(h('div','num',String(i+1).padStart(2,'0')));
    const body=h('div','body'), top=h('div','top'), head=h('div','head');
    head.append(hl(w,w+'|w','word'),h('span','ipa','('+ipa+')'));
    head.append(spkBtn(w));
    head.append(h('span','lv',LVN[lv]||''));
    const kb=h('button','kn','외움');kb.dataset.w=w;kb.setAttribute('aria-pressed',!!KN[w]);head.append(kb);
    if(KN[w])card.classList.add('known');
    const mean=h('div','mean');
    m.forEach((x,j)=>{const mi=h('span','mi');mi.append(h('span','cn',CN[j]),h('i','pos',x[0]),hl(x[1],w+'|m'+j));mean.append(mi)});
    top.append(head,mean);
    const exs=h('div','exs');
    ex.forEach((x,j)=>{
      const row=h('div','ex'), box=h('div'), en=h('div','en'), ko=h('div','ko'+(allKo?'':' hid'));
      en.append(hl(x[0],w+'|e'+j));en.append(spkBtn(x[0],true));
      ko.append(hl(x[1],w+'|k'+j));
      box.append(en,ko);row.append(h('span','cn',CN[j]),box);exs.append(row);
    });
    body.append(top,exs);card.append(body);root.append(card);
  });
  root.append(h('div','empty','이 Day의 단어를 모두 외웠습니다 🎉'));
  progress();
  document.querySelectorAll('.day').forEach(b=>b.setAttribute('aria-current',b.dataset.d==day?'true':'false'));
  $('#cur').textContent='Day '+day;
  $('#prev').disabled=day<=1;$('#next').disabled=day>=DAYS.length;
}
function cnt(d){return (DAYS[d-1]||[]).reduce((a,x)=>a+(KN[x[0]]?1:0),0)}
function progress(){
  const list=DAYS[day-1]||[], n=cnt(day);
  $('#dsub').textContent=list.length+'단어 · 외운 단어 '+n+'/'+list.length;
  $('#pbar').style.width=(list.length?n/list.length*100:0)+'%';
  document.querySelector('#list .empty').hidden=!(document.body.classList.contains('todo')&&n===list.length);
  let all=0;
  document.querySelectorAll('.day').forEach(b=>{const c=cnt(+b.dataset.d),t=(DAYS[b.dataset.d-1]||[]).length;b.classList.toggle('done',t>0&&c===t);b.classList.toggle('part',c>0&&c<t);b.lastChild.textContent=c+'/'+t});
  DAYS.forEach((x,i)=>all+=cnt(i+1));
  $('#total').textContent=DAYS.reduce((a,d)=>a+d.length,0).toLocaleString()+'단어 중 '+all.toLocaleString()+'개 외움';
}
function go(d){day=d;store.set('day',d);render();window.scrollTo(0,0)}

/* 발음 */
const CAP=window.Capacitor;
const NTTS=(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()&&CAP.Plugins&&CAP.Plugins.TextToSpeech)||null; /* 설치형 앱에서는 기기 음성을 직접 사용 */
const WEBTTS='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
const canSpeak=!!NTTS||WEBTTS;
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null;
}
if(WEBTTS){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice)}
function toast(m){let e=$('#toast');if(!e){e=h('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:86vw;text-align:center';document.body.append(e)}e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function say(t){
  const rate=t.indexOf(' ')<0?0.85:0.92;
  if(NTTS){NTTS.stop().catch(()=>{}).then(()=>NTTS.speak({text:t,lang:'en-US',rate:rate,pitch:1,volume:1})).catch(()=>toast('이 기기에 영어 음성이 없어 발음을 들을 수 없습니다'));return}
  if(!WEBTTS){toast('이 브라우저는 발음 기능을 지원하지 않습니다. Chrome이나 Safari로 열어 주세요.');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=t.indexOf(' ')<0?0.85:0.92;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('발음을 재생하지 못했습니다. 기기에 영어 음성이 있는지 확인해 주세요.')};speechSynthesis.speak(u);
}

function applyPen(){
  if(!pen)return;
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;
  const rg=sel.getRangeAt(0);let n=0;
  document.querySelectorAll('#list .hl').forEach(el=>{
    if(!rg.intersectsNode(el)||!el.offsetParent)return;
    const r=document.createRange();r.selectNodeContents(el);
    if(rg.compareBoundaryPoints(Range.START_TO_START,r)>0)r.setStart(rg.startContainer,rg.startOffset);
    if(rg.compareBoundaryPoints(Range.END_TO_END,r)<0)r.setEnd(rg.endContainer,rg.endOffset);
    const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);
    const s=pre.toString().length, e=s+r.toString().length;
    if(e>s){addRange(el.dataset.k,s,e,color);n++}
  });
  sel.removeAllRanges();
  if(n){store.set('hl',HL);lastHL=Date.now();document.querySelectorAll('#list .hl').forEach(el=>{if(HL[el.dataset.k])paint(el)})}
}
let selT=0;
document.addEventListener('pointerdown',e=>{touch=e.pointerType!=='mouse'});
document.addEventListener('mouseup',()=>{if(pen&&!touch)setTimeout(applyPen,0)});
document.addEventListener('selectionchange',()=>{if(!pen||!touch)return;clearTimeout(selT);selT=setTimeout(applyPen,900)});

document.addEventListener('click',e=>{
  const t=e.target;
  const sp=t.closest('.spk');if(sp){say(sp.dataset.say);return}
  const d=t.closest('.day');if(d){go(+d.dataset.d);setOpen(false);return}
  if(t.closest('#menu')){setOpen(!document.body.classList.contains('open'));return}
  if(t.closest('#shade')){setOpen(false);return}
  const kb=t.closest('.kn');if(kb){
    const w=kb.dataset.w;if(KN[w])delete KN[w];else KN[w]=1;store.set('known',KN);
    kb.setAttribute('aria-pressed',!!KN[w]);kb.closest('.card').classList.toggle('known',!!KN[w]);progress();return;
  }
  if(Date.now()-lastHL<450)return;
  const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;
  const mk=t.closest('mark');
  if(mk&&pen){
    const el=mk.closest('.hl'),k=el.dataset.k;
    HL[k]=(HL[k]||[]).filter(r=>r[0]!=mk.dataset.s);if(!HL[k].length)delete HL[k];
    store.set('hl',HL);paint(el);return;
  }
  const ko=t.closest('.ko');if(ko){ko.classList.toggle('hid');return}
  const mn=t.closest('.mean');if(mn&&document.body.classList.contains('test')){mn.classList.toggle('shown');return}
});
function setPen(v){
  pen=v;document.body.classList.toggle('pen',v);$('#pen').setAttribute('aria-pressed',v);
  $('#hint').textContent=v?'형광펜 켜짐 — 글자를 드래그(휴대폰은 길게 눌러 선택)하면 줄이 그어지고 자동 저장됩니다. 그어진 줄을 누르면 지워집니다.':'한글 해석은 가려져 있습니다. 누르면 보이고, 다시 누르면 가려집니다.';
}
$('#pen').onclick=()=>setPen(!pen);
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  color=b.dataset.c;store.set('color',color);
  document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(!pen)setPen(true);
});
document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===color));
$('#test').checked=store.get('test',true);
function setTest(v){document.body.classList.toggle('test',v);store.set('test',v);document.querySelectorAll('.mean.shown').forEach(x=>x.classList.remove('shown'))}
$('#test').onchange=e=>setTest(e.target.checked);
$('#allko').onclick=()=>{
  allKo=!allKo;$('#allko').setAttribute('aria-pressed',allKo);$('#allko').textContent=allKo?'해석 모두 가리기':'해석 모두 보기';
  document.querySelectorAll('.ko').forEach(k=>k.classList.toggle('hid',!allKo));
};
$('#todo').checked=store.get('todo',false);document.body.classList.toggle('todo',$('#todo').checked);
$('#todo').onchange=e=>{document.body.classList.toggle('todo',e.target.checked);store.set('todo',e.target.checked);progress()};
$('#prev').onclick=()=>day>1&&go(day-1);
$('#next').onclick=()=>day<DAYS.length&&go(day+1);

/* Day 버튼: 넓은 화면은 왼쪽 표, 좁은 화면은 위쪽 가로 줄 */
for(let d=1;d<=DAYS.length;d++){const b=h('button','day');b.dataset.d=d;b.append(h('span','','Day '+d),h('small'));$('#dlist').append(b)}
const mq=window.matchMedia('(min-width:900px)');
function setOpen(v){
  document.body.classList.toggle('open',v&&!mq.matches);
  const on=document.body.classList.contains('open');
  $('#menu').setAttribute('aria-expanded',on);$('#drawer').inert=!on&&!mq.matches;
  if(on)$('#dlist').scrollTop=0;
}
mq.addEventListener?mq.addEventListener('change',()=>setOpen(false)):mq.addListener(()=>setOpen(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
/* 왼쪽 가장자리에서 밀면 열리고, 왼쪽으로 밀면 닫힘 */
let sx=null,sy=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];const on=document.body.classList.contains('open');sx=(on||t.clientX<28)?t.clientX:null;sy=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);const on=document.body.classList.contains('open');if(Math.abs(dx)>60&&dy<50){if(!on&&dx>0)setOpen(true);else if(on&&dx<0)setOpen(false)}sx=null},{passive:true});
setOpen(false);
document.body.classList.toggle('test',$('#test').checked);
setPen(false);render();
/* 홈 화면에 추가 안내: 웹 주소로 열었고 아직 설치하지 않았을 때만 */
(function(){
  const web=/^https?:$/.test(location.protocol)&&!NTTS;
  const alone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(!web||alone)return;
  const ua=navigator.userAgent;
  const ios=!/Android/i.test(ua)&&(/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1));
  const inapp=/KAKAOTALK|NAVER\(|Instagram|FBAN|FBAV|Line\//i.test(ua);
  const mobile=ios||/Android/i.test(ua);
  let dp=null;
  function show(){
    $('#imsg').textContent=dp?'홈 화면에 앱으로 설치하면 인터넷 없이도 볼 수 있습니다.'
      :inapp?'이 화면에서는 설치할 수 없습니다. 오른쪽 위 메뉴에서 "다른 브라우저로 열기"를 눌러 '+(ios?'Safari':'Chrome')+'로 연 뒤 설치해 주세요.'
      :ios?'아래(또는 위)의 공유 버튼 □↑ 을 누르고 "홈 화면에 추가"를 선택하면 앱처럼 설치됩니다.'
      :'브라우저 메뉴(⋮)에서 "앱 설치" 또는 "홈 화면에 추가"를 누르면 앱처럼 설치됩니다.';
    $('#igo').hidden=!dp;$('#ibar').hidden=false;
  }
  function hide(keep){$('#ibar').hidden=true;if(keep)store.set('instx',1)}
  $('#inst').hidden=false;
  $('#inst').onclick=()=>{setOpen(false);show()};
  $('#ix').onclick=()=>hide(true);
  $('#igo').onclick=()=>{if(!dp)return;dp.prompt();dp.userChoice.then(()=>{dp=null;hide(true)})};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!store.get('instx',0))show()});
  window.addEventListener('appinstalled',()=>{hide(true);$('#inst').hidden=true});
  if(mobile&&!store.get('instx',0))setTimeout(()=>{if(!dp)show()},1500);
})();
/* 웹앱으로 올렸을 때만: 오프라인에서도 열리도록 저장 */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!NTTS)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
